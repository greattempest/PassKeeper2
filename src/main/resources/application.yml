server:
  port : 8081

spring:
  datasource:
    url : jdbc:mysql://localhost:3306/passkeeper?serverTimezone=UTC
    username : passkeeper
    password : Wonders,123 #阿里云正式
    #password : 123456 #本地测试
    driver-class-name : com.mysql.cj.jdbc.Driver
  devtools:
    restart:
      enabled: true  #设置开启热部署
      additional-paths: src/main/java #重启目录
      exclude: WEB-INF/**
  security:
    user:
      name: actuator
      password: actuator
      roles: ACTUATOR_ADMIN
  jpa:
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
    database-platform: org.hibernate.dialect.MySQLDialect


management:
  endpoint:
    health:
      show-details: always
      